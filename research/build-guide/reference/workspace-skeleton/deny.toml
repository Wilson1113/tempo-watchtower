[graph]
all-features = true

[advisories]
# RustSec database; fails on vulnerabilities, warns on unmaintained crates we don't control.
yanked = "deny"
ignore = [
  # paste: unmaintained, pulled in transitively by alloy. Same ignore as tempoxyz/mpp-rs deny.toml.
  { id = "RUSTSEC-2024-0436", reason = "transitive via alloy; no safe upgrade available" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
  "CC0-1.0", "BSL-1.0", "0BSD", "Unlicense", "CDLA-Permissive-2.0", "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
